# Dependabot revisa package-lock.json una vez por semana y abre PRs para actualizar dependencias.
# Solo se aplica desde la rama por defecto (main).
#
# Las alertas de vulnerabilidades y los PRs de seguridad automáticos no se activan aquí, sino en
# GitHub → Settings → Advanced Security: "Dependabot alerts" y "Dependabot security updates".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    # Un solo PR semanal para todas las subidas minor/patch; las major (p. ej. Astro 7 → 8)
    # llegan cada una por separado porque pueden romper cosas.
    groups:
      menores:
        update-types:
          - minor
          - patch
